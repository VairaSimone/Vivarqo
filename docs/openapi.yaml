openapi: 3.1.0
info:
  title: Vivarqo REST API
  version: 1.0.0
  description: >
    Contratto API 1.0 per le route montate dal backend. I request body JSON usano
    schemi di dominio specifici e metadati x-source-validation che collegano ogni
    operazione ai validatori eseguiti dal backend. Le risposte JSON di successo
    usano DTO ed envelope nominati. La CI verifica copertura route, operationId,
    riferimenti interni e collegamenti alle sorgenti di validazione.
servers:
  - url: https://api.example.invalid
    description: Segnaposto; sostituire con API_ORIGIN dell'ambiente.
tags:
  - name: Auth
  - name: Account
  - name: Animals
  - name: Care
  - name: Operations
  - name: Reproduction
  - name: Inventory
  - name: Documents
  - name: Genetics
  - name: Finance
  - name: Notifications
  - name: Imports
  - name: Exports
  - name: Billing
  - name: Onboarding
security:
  - sessionCookieDev: []
  - sessionCookieProd: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [Operations]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Processo API attivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      operationId: getReadyz
      tags: [Operations]
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: API pronta e database raggiungibile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/csrf:
    get:
      operationId: getAuthCsrf
      tags: [Auth]
      summary: Ottiene un token CSRF per le richieste browser
      security: []
      responses:
        '200':
          description: Token CSRF e cookie associato.
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken:
                    type: string
  /api/v1/auth/register:
    post:
      operationId: createAuthRegister
      tags: [Auth]
      summary: Registra un account e invia la verifica email
      security:
        - csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        x-source-validation:
          file: backend/api/src/modules/auth/auth.schemas.ts
          symbol: registerSchema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Richiesta accettata; la risposta non rivela se l'email esiste.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/auth/verify-email:
    post:
      operationId: createAuthVerifyEmail
      tags: [Auth]
      summary: Consuma il token monouso di verifica email
      security:
        - csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        x-source-validation:
          file: backend/api/src/modules/auth/auth.schemas.ts
          symbol: verifyEmailSchema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/auth/resend-verification:
    post:
      operationId: createAuthResendVerification
      tags: [Auth]
      summary: Richiede un nuovo link di verifica
      security:
        - csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        x-source-validation:
          file: backend/api/src/modules/auth/auth.schemas.ts
          symbol: emailRequestSchema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/auth/login:
    post:
      operationId: createAuthLogin
      tags: [Auth]
      summary: Crea una sessione server-side
      security:
        - csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        x-source-validation:
          file: backend/api/src/modules/auth/auth.schemas.ts
          symbol: loginSchema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: createAuthLogout
      tags: [Auth]
      summary: Revoca la sessione corrente
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/v1/auth/sessions/revoke-all:
    post:
      operationId: createAuthSessionsRevokeAll
      tags: [Auth]
      summary: Revoca tutte le sessioni dell'account
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/forgot-password:
    post:
      operationId: createAuthForgotPassword
      tags: [Auth]
      summary: Richiede il reset password
      security:
        - csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        x-source-validation:
          file: backend/api/src/modules/auth/auth.schemas.ts
          symbol: emailRequestSchema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/v1/auth/reset-password:
    post:
      operationId: createAuthResetPassword
      tags: [Auth]
      summary: Consuma il token monouso per reimpostare la password
      security:
        - csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        x-source-validation:
          file: backend/api/src/modules/auth/auth.schemas.ts
          symbol: resetPasswordSchema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/auth/me:
    get:
      operationId: getAuthMe
      tags: [Auth]
      summary: Restituisce il profilo autenticato
      responses:
        '200':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/account:
    patch:
      operationId: updateAccount
      tags: [Account]
      summary: Modifica profilo, lingua, fuso orario, email o password
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        x-source-validation:
          file: backend/api/src/modules/auth/auth.schemas.ts
          symbol: accountPatchSchema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatchRequest'
      responses:
        '200':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUpdateResponse'
        '202':
          description: Modifica email in attesa di verifica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAccount
      tags: [Account]
      summary: Elimina l'account dopo verifica della password e conferma esplicita
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        x-source-validation:
          file: backend/api/src/modules/account/account.routes.ts
          symbol: confirmation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '204':
          description: Account eliminato e cookie di sessione revocato.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          description: Cancellazione non completata per indisponibilità del provider pagamenti o dello storage privato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/animals:
    get:
      operationId: getAnimals
      tags: [Animals]
      summary: Elenca gli animali con paginazione, ricerca e filtri
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema: { type: string, maxLength: 160 }
        - name: species
          in: query
          schema: { type: string }
        - name: sex
          in: query
          schema: { type: string, enum: [male, female, unknown] }
        - name: morph
          in: query
          schema: { type: string }
        - name: location
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, sold, transferred, deceased, archived, all] }
        - name: sort
          in: query
          schema: { type: string, enum: [name, createdAt, updatedAt] }
      responses:
        '200':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalListResponse'
        '401':
          $ref: '#/components/responses/Error'
    post:
      operationId: createAnimals
      tags: [Animals]
      summary: Crea un animale
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        x-source-validation:
          file: backend/api/src/modules/animals/animals.schemas.ts
          symbol: createAnimalSchema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalWrite'
      responses:
        '201':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalEnvelopeResponse'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/animals/bulk:
    post:
      operationId: createAnimalsBulk
      tags: [Animals]
      summary: Crea più animali in una transazione
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        x-source-validation:
          file: backend/api/src/modules/animals/animals.schemas.ts
          symbol: bulkAnimalsSchema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAnimalWrite'
      responses:
        '201':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalBulkResponse'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/animals/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getAnimalsById
      tags: [Animals]
      summary: Legge il dettaglio di un animale
      responses:
        '200':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalEnvelopeResponse'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateAnimalsById
      tags: [Animals]
      summary: Modifica un animale
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        x-source-validation:
          file: backend/api/src/modules/animals/animals.schemas.ts
          symbol: patchAnimalSchema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalPatch'
      responses:
        '200':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalEnvelopeResponse'
        '400':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAnimalsById
      tags: [Animals]
      summary: Elimina un animale solo se le relazioni lo consentono
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Animale eliminato.
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/animals/{id}/photo:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getAnimalsByIdPhoto
      tags: [Animals]
      summary: Restituisce la fotografia privata dell'animale proprietario
      responses:
        '200':
          description: Fotografia privata dell'animale.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: createAnimalsByIdPhoto
      tags: [Animals]
      summary: Carica o sostituisce la fotografia principale dell'animale
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Fotografia caricata o sostituita.
          content:
            application/json:
              schema:
                type: object
                required: [photoUrl]
                properties:
                  photoUrl: { type: string }
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAnimalsByIdPhoto
      tags: [Animals]
      summary: Rimuove la fotografia dell'animale e cancella l'oggetto privato
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Fotografia rimossa.
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/public/animals/{slug}/photo:
    get:
      operationId: getPublicAnimalsBySlugPhoto
      tags: [Animals]
      summary: Restituisce la fotografia se la condivisione pubblica la autorizza
      description: Il link pubblico deve essere attivo, non revocato, non archiviato e avere photo nella allowlist visibleFields.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{32}$' }
      responses:
        '200':
          description: Fotografia autorizzata dalla condivisione pubblica.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/animals/{id}/archive:
    post:
      operationId: createAnimalsByIdArchive
      tags: [Animals]
      summary: Archivia un animale senza cancellarne lo storico
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalEnvelopeResponse'
  /api/v1/animals/{id}/restore:
    post:
      operationId: createAnimalsByIdRestore
      tags: [Animals]
      summary: Ripristina un animale archiviato
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalEnvelopeResponse'
  /api/v1/feeding-sessions:
    get:
      operationId: getFeedingSessions
      tags: [Care]
      summary: Elenca sessioni di alimentazione
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: animalId
          in: query
          description: Limita le sessioni agli eventi dell'animale e restituisce solo le relative voci.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedingSessionsResponse'
    post:
      operationId: createFeedingSessions
      tags: [Care]
      summary: Registra una sessione con risultati indipendenti per animale
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        x-source-validation:
          file: backend/api/src/modules/animals/animals.schemas.ts
          symbol: feedingSessionSchema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedingSessionWrite'
      responses:
        '201':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedingSessionCreatedResponse'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/feeding-sessions/{id}:
    get:
      operationId: getFeedingSessionsById
      tags: [Care]
      summary: Legge la sessione con le relative voci
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedingSessionEnvelopeResponse'
  /api/v1/feeding-entries/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: updateFeedingEntriesById
      tags: [Care]
      summary: Corregge una voce di alimentazione, inclusa la data
      description: Se la voce appartiene a una sessione multipla, la modifica della data separa solo la voce selezionata e preserva data e note delle altre voci.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        x-source-validation:
          file: backend/api/src/modules/animals/animals.schemas.ts
          symbol: patchFeedingEntrySchema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedingEntryPatch'
      responses:
        '200':
          description: Risposta JSON specifica dell'operazione.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedingEntryEnvelopeResponse'
    delete:
      operationId: deleteFeedingEntriesById
      tags: [Care]
      summary: Elimina una voce di alimentazione
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Voce eliminata.
  /api/v1/animals/{animalId}/feeding-summary:
    parameters:
      - $ref: '#/components/parameters/AnimalId'
    get:
      operationId: getAnimalsByAnimalIdFeedingSummary
      tags: [Care]
      summary: Statistiche alimentari, ultimo pasto accettato e prossima previsione
      responses:
        '200':
          description: Metriche calcolate dai registri di alimentazione.
          content:
            application/json:
              schema:
                type: object
                required: [feedingIntervalDays, lastAcceptedAt, daysSinceLastFeeding, nextMealAt, consecutiveRefusals, acceptedCount, refusedCount, offeredCount, acceptanceRate]
                properties:
                  feedingIntervalDays: { type: [integer, 'null'], minimum: 1, maximum: 365 }
                  lastAcceptedAt: { type: [string, 'null'], format: date-time }
                  daysSinceLastFeeding: { type: [integer, 'null'], minimum: 0 }
                  nextMealAt: { type: [string, 'null'], format: date-time }
                  consecutiveRefusals: { type: integer, minimum: 0 }
                  acceptedCount: { type: integer, minimum: 0 }
                  refusedCount: { type: integer, minimum: 0 }
                  offeredCount: { type: integer, minimum: 0 }
                  acceptanceRate: { type: [number, 'null'], minimum: 0, maximum: 1 }


  /api/v1/animals/{animalId}/weight-growth:
    parameters:
      - $ref: '#/components/parameters/AnimalId'
    get:
      operationId: getAnimalsByAnimalIdWeightGrowth
      tags: [Care]
      summary: Analizza crescita e variazioni del peso
      parameters:
        - name: periodDays
          in: query
          required: false
          schema:
            type: string
            enum: ['30', '90', '180', '365', all]
      responses:
        '200':
          description: Analisi dello storico del peso
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/animals/{animalId}/weights/export.csv:
    parameters:
      - $ref: '#/components/parameters/AnimalId'
    get:
      operationId: exportAnimalsByAnimalIdWeightsCsv
      tags: [Care]
      summary: Esporta lo storico delle pesature in CSV
      responses:
        '200':
          description: File CSV dello storico pesature
          content:
            text/csv:
              schema:
                type: string

  /api/v1/animals/{animalId}/health-records:
    parameters:
      - $ref: '#/components/parameters/AnimalId'
    get:
      operationId: getAnimalsByAnimalIdHealthRecords
      tags: [Care]
      summary: Elenca la cartella sanitaria dell'animale
      responses:
        '200':
          description: Elenco delle registrazioni sanitarie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecordsResponse'
    post:
      operationId: createAnimalsByAnimalIdHealthRecords
      tags: [Care]
      summary: Registra una visita, un sintomo o un trattamento
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        x-source-validation:
          file: backend/api/src/modules/animals/health.routes.ts
          symbol: recordSchema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthRecordWrite'
      responses:
        '201':
          description: Registrazione sanitaria creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecordResponse'
  /api/v1/health-records/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: updateHealthRecordsById
      tags: [Care]
      summary: Aggiorna una registrazione sanitaria
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        x-source-validation:
          file: backend/api/src/modules/animals/health.routes.ts
          symbol: recordSchema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthRecordWrite'
      responses:
        '200':
          description: Registrazione aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecordResponse'
    delete:
      operationId: deleteHealthRecordsById
      tags: [Care]
      summary: Elimina una registrazione sanitaria
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Registrazione eliminata

