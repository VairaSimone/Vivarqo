        clinic: { type: [string, 'null'], maxLength: 160 }
        medication: { type: [string, 'null'], maxLength: 160 }
        dosage: { type: [string, 'null'], maxLength: 120 }
        frequency: { type: [string, 'null'], maxLength: 120 }
        treatmentStartAt: { type: [string, 'null'], format: date-time }
        treatmentEndAt: { type: [string, 'null'], format: date-time }
        nextDueAt: { type: [string, 'null'], format: date-time }
        notes: { type: [string, 'null'], maxLength: 20000 }
