      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
        '400':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookieDev:
      type: apiKey
      in: cookie
      name: vivarqo_session
      description: Cookie HttpOnly in development e test.
    sessionCookieProd:
      type: apiKey
      in: cookie
      name: __Host-vivarqo_session
      description: Cookie HttpOnly Secure in produzione.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnimalId:
      name: animalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  requestBodies:
    JsonObject:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiObject'
  responses:
    JsonSuccess:
      description: Operazione riuscita.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiObject'
    Error:
      description: Errore strutturato.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ApiObject:
      type: object
      additionalProperties: true
      description: Schema transitorio; sostituire con uno schema di dominio specifico.
    Health:
      type: object
      required: [status, requestId]
      properties:
        status: { type: string, enum: [ok, ready] }
        requestId: { type: string }
    ErrorResponse:
      type: object
      required: [code, message, details, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: 'null'
        requestId: { type: string }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, password]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        locale: { type: string, enum: [it, en] }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        password: { type: string, minLength: 12, maxLength: 128 }
    AccountPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        locale: { type: string, enum: [it, en] }
        timezone: { type: string, maxLength: 64, description: Nome fuso IANA }
        email: { type: string, format: email, maxLength: 254 }
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 12, maxLength: 128 }
    AnimalWrite:
      type: object
      additionalProperties: false
      required: [name, species]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        identifier: { type: [string, 'null'], maxLength: 120 }
        species: { type: string, minLength: 1, maxLength: 160 }
        sex: { type: string, enum: [male, female, unknown], default: unknown }
        morph: { type: [string, 'null'], maxLength: 200 }
        geneticsNotes: { type: [string, 'null'], maxLength: 10000 }
        birthDate: { type: [string, 'null'], format: date }
        birthDateEstimated: { type: boolean, default: false }
        acquiredDate: { type: [string, 'null'], format: date }
        originDescription: { type: [string, 'null'], maxLength: 5000 }
        previousBreeder: { type: [string, 'null'], maxLength: 160 }
        locationLabel: { type: [string, 'null'], maxLength: 160 }
        status: { type: string, enum: [active, sold, transferred, deceased], default: active }
        notes: { type: [string, 'null'], maxLength: 10000 }
    AnimalPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        identifier: { type: [string, 'null'], maxLength: 120 }
        species: { type: string, minLength: 1, maxLength: 160 }
        sex: { type: string, enum: [male, female, unknown] }
        morph: { type: [string, 'null'], maxLength: 200 }
        geneticsNotes: { type: [string, 'null'], maxLength: 10000 }
        birthDate: { type: [string, 'null'], format: date }
        birthDateEstimated: { type: boolean }
        acquiredDate: { type: [string, 'null'], format: date }
        originDescription: { type: [string, 'null'], maxLength: 5000 }
        previousBreeder: { type: [string, 'null'], maxLength: 160 }
