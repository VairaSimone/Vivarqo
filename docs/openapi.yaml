openapi: 3.1.0
info:
  title: Vivarqo REST API
  version: 1.0.0-draft
  description: >
    Contratto iniziale versionato per le route implementate nel branch main.
    Le rotte mutative browser richiedono X-CSRF-Token. Le rotte private richiedono
    una sessione server-side tramite cookie HttpOnly. I payload ApiObject sono
    provvisori per le aree il cui schema Zod non è ancora stato promosso a schema
    request/response dedicato; questo documento non è ancora la prova di conformità
    completa alla specifica tecnica 1.0.
servers:
  - url: https://api.example.invalid
    description: Segnaposto; sostituire con API_ORIGIN dell'ambiente.
tags:
  - name: Auth
  - name: Account
  - name: Animals
  - name: Care
  - name: Operations
  - name: Reproduction
  - name: Inventory
  - name: Documents
  - name: Genetics
  - name: Finance
  - name: Notifications
  - name: Imports
  - name: Exports
  - name: Billing
security:
  - sessionCookieDev: []
  - sessionCookieProd: []
paths:
  /healthz:
    get:
      tags: [Operations]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Processo API attivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags: [Operations]
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: API pronta e database raggiungibile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/csrf:
    get:
      tags: [Auth]
      summary: Ottiene un token CSRF per le richieste browser
      security: []
      responses:
        '200':
          description: Token CSRF e cookie associato.
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken:
                    type: string
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Registra un account e invia la verifica email
      security:
        - csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Richiesta accettata; la risposta non rivela se l'email esiste.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiObject'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      summary: Consuma il token monouso di verifica email
      security:
        - csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Richiede un nuovo link di verifica
      security:
        - csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Crea una sessione server-side
      security:
        - csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoca la sessione corrente
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/auth/sessions/revoke-all:
    post:
      tags: [Auth]
      summary: Revoca tutte le sessioni dell'account
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Richiede il reset password
      security:
        - csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Consuma il token monouso per reimpostare la password
      security:
        - csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Restituisce il profilo autenticato
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/account:
    patch:
      tags: [Account]
      summary: Modifica profilo, lingua, fuso orario, email o password
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatchRequest'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
        '202':
          description: Modifica email in attesa di verifica.
        '400':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Account]
      summary: Elimina l'account dopo verifica della password e conferma esplicita
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, confirmation]
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                  maxLength: 256
                confirmation:
                  type: string
                  const: DELETE
      responses:
        '204':
          description: Account eliminato e cookie di sessione revocato.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          description: Cancellazione non completata per indisponibilità del provider pagamenti o dello storage privato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/animals:
    get:
      tags: [Animals]
      summary: Elenca gli animali con paginazione, ricerca e filtri
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema: { type: string, maxLength: 160 }
        - name: species
          in: query
          schema: { type: string }
        - name: sex
          in: query
          schema: { type: string, enum: [male, female, unknown] }
        - name: morph
          in: query
          schema: { type: string }
        - name: location
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, sold, transferred, deceased, archived, all] }
        - name: sort
          in: query
          schema: { type: string, enum: [name, createdAt, updatedAt] }
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [Animals]
      summary: Crea un animale
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalWrite'
      responses:
        '201':
          $ref: '#/components/responses/JsonSuccess'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/animals/bulk:
    post:
      tags: [Animals]
      summary: Crea più animali in una transazione
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [animals]
              properties:
                animals:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/AnimalWrite'
      responses:
        '201':
          $ref: '#/components/responses/JsonSuccess'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/animals/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Animals]
      summary: Legge il dettaglio di un animale
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [Animals]
      summary: Modifica un animale
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalPatch'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
        '400':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Animals]
      summary: Elimina un animale solo se le relazioni lo consentono
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Animale eliminato.
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/animals/{id}/archive:
    post:
      tags: [Animals]
      summary: Archivia un animale senza cancellarne lo storico
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/animals/{id}/restore:
    post:
      tags: [Animals]
      summary: Ripristina un animale archiviato
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/feeding-sessions:
    get:
      tags: [Care]
      summary: Elenca sessioni di alimentazione
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    post:
      tags: [Care]
      summary: Registra una sessione con risultati indipendenti per animale
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedingSessionWrite'
      responses:
        '201':
          $ref: '#/components/responses/JsonSuccess'
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/feeding-sessions/{id}:
    get:
      tags: [Care]
      summary: Legge la sessione con le relative voci
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/feeding-entries/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Care]
      summary: Corregge una voce di alimentazione
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    delete:
      tags: [Care]
      summary: Elimina una voce di alimentazione
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Voce eliminata.
  /api/v1/animals/{animalId}/weights:
    parameters:
      - $ref: '#/components/parameters/AnimalId'
    get:
      tags: [Care]
      summary: Elenca le pesate dell'animale
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    post:
      tags: [Care]
      summary: Registra una pesata in grammi
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeightWrite'
      responses:
        '201':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/animals/{animalId}/sheds:
    parameters:
      - $ref: '#/components/parameters/AnimalId'
    get:
      tags: [Care]
      summary: Elenca le mute
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    post:
      tags: [Care]
      summary: Registra una muta
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '201':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/animals/{animalId}/notes:
    parameters:
      - $ref: '#/components/parameters/AnimalId'
    get:
      tags: [Care]
      summary: Elenca le osservazioni
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    post:
      tags: [Care]
      summary: Crea un'osservazione
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '201':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/weights/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Care]
      summary: Modifica una pesata
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    delete:
      tags: [Care]
      summary: Elimina una pesata
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Pesata eliminata.
  /api/v1/sheds/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Care]
      summary: Modifica una muta
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    delete:
      tags: [Care]
      summary: Elimina una muta
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Muta eliminata.
  /api/v1/animal-notes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Care]
      summary: Modifica una nota
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    delete:
      tags: [Care]
      summary: Elimina una nota
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Nota eliminata o archiviata secondo il flusso applicativo.
  /api/v1/animals/{animalId}/history:
    get:
      tags: [Care]
      summary: Cronologia unificata e paginata dell'animale
      parameters:
        - $ref: '#/components/parameters/AnimalId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/tasks:
    get:
      tags: [Operations]
      summary: Elenca attività con filtri
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    post:
      tags: [Operations]
      summary: Crea un'attività
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskWrite'
      responses:
        '201':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Operations]
      summary: Legge un'attività
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    patch:
      tags: [Operations]
      summary: Modifica un'attività
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    delete:
      tags: [Operations]
      summary: Elimina un'attività
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Attività eliminata.
  /api/v1/tasks/{id}/complete:
    post:
      tags: [Operations]
      summary: Completa un'attività e genera la prossima occorrenza se ricorrente
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/tasks/reminder-rules:
    get:
      tags: [Operations]
      summary: Elenca regole di promemoria
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    post:
      tags: [Operations]
      summary: Crea una regola di promemoria
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '201':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/tasks/reminder-rules/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Operations]
      summary: Modifica una regola di promemoria
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    delete:
      tags: [Operations]
      summary: Elimina una regola di promemoria
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Regola eliminata.
  /api/v1/home/today:
    get:
      tags: [Operations]
      summary: Riepilogo operativo Oggi
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/calendar:
    get:
      tags: [Operations]
      summary: Eventi derivati e attività nel periodo
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: view
          in: query
          schema: { type: string, enum: [month, week, list] }
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/reproduction-cycles:
    get:
      tags: [Reproduction]
      summary: Elenca cicli riproduttivi
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    post:
      tags: [Reproduction]
      summary: Crea un ciclo riproduttivo
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '201':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/reproduction-cycles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Reproduction]
      summary: Legge un ciclo
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    patch:
      tags: [Reproduction]
      summary: Modifica un ciclo
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    delete:
      tags: [Reproduction]
      summary: Elimina un ciclo
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Ciclo eliminato se le relazioni lo consentono.
  /api/v1/reproduction-cycles/{id}/events:
    get:
      tags: [Reproduction]
      summary: Elenca eventi riproduttivi del ciclo
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    post:
      tags: [Reproduction]
      summary: Registra un evento riproduttivo
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '201':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/clutches:
    post:
      tags: [Reproduction]
      summary: Crea una covata
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '201':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/clutches/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Reproduction]
      summary: Legge una covata
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    patch:
      tags: [Reproduction]
      summary: Modifica una covata
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    delete:
      tags: [Reproduction]
      summary: Elimina una covata
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Covata eliminata se non esistono riferimenti restrittivi.
  /api/v1/clutches/{id}/eggs:
    get:
      tags: [Reproduction]
      summary: Elenca uova della covata
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/JsonSuccess'
    post:
      tags: [Reproduction]
      summary: Aggiunge uova alla covata
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/JsonObject'
      responses:
        '201':
          $ref: '#/components/responses/JsonSuccess'
  /api/v1/eggs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
