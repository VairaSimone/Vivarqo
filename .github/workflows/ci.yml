name: Vivarqo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate and bundle OpenAPI contract
        run: npx --yes @redocly/cli bundle docs/openapi.yaml --output /tmp/vivarqo-openapi.bundle.yaml

  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://vivarqo:vivarqo_dev@127.0.0.1:5432/vivarqo?schema=public
      NODE_ENV: test
      RUN_DB_INTEGRATION: "true"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vivarqo
          POSTGRES_USER: vivarqo
          POSTGRES_PASSWORD: vivarqo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vivarqo -d vivarqo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply PostgreSQL migration
        run: pnpm db:migrate:deploy
      - name: Verify backup and restore scripts against an isolated PostgreSQL database
        run: |
          backup_dir="$RUNNER_TEMP/vivarqo-backup"
          mkdir -p "$backup_dir"
          docker run --rm --network host \
            -e DATABASE_URL='postgresql://vivarqo:vivarqo_dev@127.0.0.1:5432/vivarqo?schema=public' \
            -e BACKUP_DIR=/backups \
            -e RESTORE_DB_URL='postgresql://vivarqo:vivarqo_dev@127.0.0.1:5432/vivarqo_restore_drill' \
            -e MAINT_URL='postgresql://vivarqo:vivarqo_dev@127.0.0.1:5432/postgres' \
            -v "$GITHUB_WORKSPACE/backend/scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro" \
            -v "$GITHUB_WORKSPACE/backend/scripts/restore-postgres.sh:/usr/local/bin/restore-postgres.sh:ro" \
            -v "$backup_dir:/backups" \
            postgres:18 bash -Eeuo pipefail -c '
              trap '\''psql "$MAINT_URL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS vivarqo_restore_drill WITH (FORCE)" >/dev/null 2>&1 || true'\'' EXIT
              bash /usr/local/bin/backup-postgres.sh
              archive="$(find /backups -maxdepth 1 -type f -name "vivarqo-*.dump" -print -quit)"
              test -n "$archive"
              psql "$MAINT_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE vivarqo_restore_drill"
              DATABASE_URL="$RESTORE_DB_URL" CONFIRM_RESTORE=YES bash /usr/local/bin/restore-postgres.sh "$archive"
              restored_count="$(psql "$RESTORE_DB_URL" -Atqc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '\''public'\'' AND table_type = '\''BASE TABLE'\'' AND table_name <> '\''_prisma_migrations'\''")"
              test "$restored_count" -ge 33
            '
      - name: Type-check API
        run: pnpm typecheck
      - name: Test API
        run: pnpm test
      - name: Build API
        run: pnpm build:api
      - name: Docker build
        run: docker build -f backend/Dockerfile -t vivarqo-api:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm build:frontend
      - name: Install browser-test dependencies
        working-directory: frontend/e2e
        run: npm install --no-audit --no-fund
      - name: Install Chromium for Playwright
        working-directory: frontend/e2e
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        working-directory: frontend/e2e
        run: npm test
