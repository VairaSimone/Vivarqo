name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://vivarqo:vivarqo_dev@127.0.0.1:5432/vivarqo?schema=public
      NODE_ENV: test
      RUN_DB_INTEGRATION: "true"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vivarqo
          POSTGRES_USER: vivarqo
          POSTGRES_PASSWORD: vivarqo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vivarqo -d vivarqo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply PostgreSQL migration
        run: pnpm db:migrate:deploy
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Docker build
        run: docker build -f apps/api/Dockerfile -t vivarqo-api:ci .
