name: Refresh pnpm lockfile (temporary migration helper)

on:
  push:
    branches:
      - feat/compliance-priorities-2026-10
    paths:
      - "frontend/package.json"
      - "backend/api/package.json"
      - "pnpm-workspace.yaml"
      - "package.json"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Refresh lockfile from workspace manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml is already in sync"
            exit 0
          fi
          git commit -m "chore: refresh pnpm lockfile"
          git push
