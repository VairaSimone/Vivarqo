name: Vivarqo production deployment

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA already reachable from main"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vivarqo-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved commit to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deployment input
        shell: bash
        env:
          DEPLOY_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "commit_sha must be a full 40-character SHA" >&2
            exit 1
          }

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.VIVARQO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.VIVARQO_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.VIVARQO_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.VIVARQO_DEPLOY_KNOWN_HOSTS }}
          PUBLIC_DOMAIN: ${{ secrets.VIVARQO_PUBLIC_DOMAIN }}
          DEPLOY_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS PUBLIC_DOMAIN; do
            [[ -n "${!name}" ]] || { echo "Missing GitHub secret: $name" >&2; exit 2; }
          done
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid deploy host" >&2; exit 2; }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "Invalid deploy user" >&2; exit 2; }
          [[ "$PUBLIC_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid public domain" >&2; exit 2; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/vivarqo_deploy
          chmod 600 ~/.ssh/vivarqo_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/vivarqo_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$DEPLOY_SHA' '$PUBLIC_DOMAIN'" <<'REMOTE'
          set -Eeuo pipefail
          deploy_sha="$1"
          public_domain="$2"
          app_dir="/opt/vivarqo/app"
          cd "$app_dir"

          git fetch --prune origin main
          git cat-file -e "${deploy_sha}^{commit}"
          git merge-base --is-ancestor "$deploy_sha" origin/main || {
            echo "Refusing to deploy a commit that is not reachable from origin/main" >&2
            exit 3
          }
          git checkout --detach "$deploy_sha"

          compose=(docker compose --env-file .env.production -f backend/infra/docker/compose.production.yaml)
          "${compose[@]}" config --quiet
          mountpoint -q "$(grep '^VIVARQO_BACKUP_DIR=' .env.production | cut -d= -f2-)" || {
            echo "Configured PostgreSQL backup path is not a mounted filesystem" >&2
            exit 4
          }

          # Take and verify a fresh PostgreSQL dump before any schema change.
          "${compose[@]}" run --rm --no-deps --entrypoint /bin/sh backup -ec '
            umask 077
            export PGPASSWORD="$(cat "$POSTGRES_PASSWORD_FILE")"
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            temporary="/backups/vivarqo-predeploy-$stamp.dump.partial"
            archive="/backups/vivarqo-predeploy-$stamp.dump"
            pg_dump --host="$POSTGRES_HOST" --port="$POSTGRES_PORT" --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --format=custom --no-owner --no-acl --file="$temporary"
            pg_restore --list "$temporary" >/dev/null
            mv "$temporary" "$archive"
            sha256sum "$archive" > "$archive.sha256"
            chmod 600 "$archive" "$archive.sha256"
            echo "Verified pre-deploy database backup: $archive"
          '

          # Build before touching the running services. Migrations run as a
          # separate one-shot service and must succeed before the API is started.
          "${compose[@]}" build api web worker migrate
          "${compose[@]}" run --rm migrate
          "${compose[@]}" up -d --no-build --remove-orphans

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --resolve "$public_domain:443:127.0.0.1" \
              "https://$public_domain/readyz" >/dev/null; then
              echo "Production readiness check passed for $deploy_sha"
              exit 0
            fi
            sleep 10
          done

          echo "Production did not become ready. Do not roll back the database automatically." >&2
          "${compose[@]}" ps
          "${compose[@]}" logs --tail=150 api web migrate
          exit 1
          REMOTE

      - name: Remove temporary SSH material
        if: always()
        run: rm -f ~/.ssh/vivarqo_deploy ~/.ssh/known_hosts
