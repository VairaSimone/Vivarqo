name: One-time branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prune:
    if: contains(github.event.head_commit.message, '[one-time-prune-branches]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete every non-main branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GH_REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          branches_json="$(curl -fsS "${headers[@]}" "${api}/branches?per_page=100")"
          mapfile -t branches < <(jq -r '.[].name' <<< "${branches_json}")

          for branch in "${branches[@]}"; do
            if [[ "${branch}" == "main" ]]; then
              continue
            fi

            response_file="$(mktemp)"
            status="$(curl -sS -o "${response_file}" -w '%{http_code}' -X DELETE "${headers[@]}" "${api}/git/refs/heads/${branch}")"
            if [[ "${status}" != "204" ]]; then
              echo "Failed to delete branch '${branch}' (HTTP ${status}):"
              cat "${response_file}"
              rm -f "${response_file}"
              exit 1
            fi
            rm -f "${response_file}"
            echo "Deleted branch: ${branch}"
          done

      - name: Remove this temporary workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GH_REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          path=".github/workflows/prune-branches-once.yml"
          file_json="$(curl -fsS "${headers[@]}" "${api}/contents/${path}?ref=main")"
          file_sha="$(jq -r '.sha' <<< "${file_json}")"
          payload="$(jq -n --arg message "chore: remove temporary branch cleanup workflow" --arg sha "${file_sha}" --arg branch "main" '{message:$message,sha:$sha,branch:$branch}')"
          response_file="$(mktemp)"
          status="$(curl -sS -o "${response_file}" -w '%{http_code}' -X DELETE "${headers[@]}" -d "${payload}" "${api}/contents/${path}")"
          if [[ "${status}" != "200" ]]; then
            echo "Failed to remove temporary workflow (HTTP ${status}):"
            cat "${response_file}"
            rm -f "${response_file}"
            exit 1
          fi
          rm -f "${response_file}"
          echo "Temporary workflow removed from main."
