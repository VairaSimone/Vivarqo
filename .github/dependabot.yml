version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    groups:
      production-and-development-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/apps/api"
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    groups:
      api-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
