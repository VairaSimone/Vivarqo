# DEVELOPMENT ONLY. Do not deploy this file to a public environment.
# Production/staging use compose.production.yaml with file-backed secrets and private networks.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: vivarqo
      POSTGRES_USER: vivarqo
      POSTGRES_PASSWORD: vivarqo_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vivarqo-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivarqo -d vivarqo"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
    command: ["node", "backend/api/dist/migrate.js"]
    restart: "no"
    env_file:
      - ../../../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://vivarqo:vivarqo_dev@postgres:5432/vivarqo?schema=public
      PRIVATE_STORAGE_PATH: /app/var/private
    volumes:
      - vivarqo-private-data:/app/var/private
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      DATABASE_URL: postgresql://vivarqo:vivarqo_dev@postgres:5432/vivarqo?schema=public
      PRIVATE_STORAGE_PATH: /app/var/private
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - vivarqo-private-data:/app/var/private
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
      target: web-runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
    command: ["node", "backend/api/dist/worker.js"]
    restart: unless-stopped
    env_file:
      - ../../../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://vivarqo:vivarqo_dev@postgres:5432/vivarqo?schema=public
      PRIVATE_STORAGE_PATH: /app/var/private
    volumes:
      - vivarqo-private-data:/app/var/private
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  vivarqo-postgres-data:
  vivarqo-private-data:
