<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vivarqo Dev Manager</title>
<style>
:root{color-scheme:dark;--bg:#101713;--panel:#18231d;--panel2:#202e26;--line:#304238;--text:#edf4ee;--muted:#a9b9ad;--green:#85c69b;--red:#f08b83;--amber:#e8c27c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,Segoe UI,sans-serif}header{padding:24px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 14px}.muted{color:var(--muted)}main{max-width:1400px;margin:auto;padding:24px clamp(16px,4vw,48px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.panel,.service{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.service{display:flex;justify-content:space-between;align-items:center;gap:12px}.name{font-weight:650}.state{font-size:12px;padding:4px 9px;border-radius:20px;background:var(--panel2);color:var(--muted)}.healthy{color:var(--green)}.failed,.crashed{color:var(--red)}.degraded,.restarting{color:var(--amber)}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;margin-top:16px}.logs{height:430px;overflow:auto;background:#0b100d;border:1px solid var(--line);border-radius:8px;padding:12px;font:12px/1.65 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.log{padding:2px 0;border-bottom:1px solid #1c2821}.ERROR,.FATAL{color:var(--red)}.WARN{color:var(--amber)}.INFO{color:#b7c9bb}button{background:#315d42;color:white;border:1px solid #477a59;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:600}button.secondary{background:var(--panel2);border-color:var(--line)}button:hover{filter:brightness(1.15)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.issue{border-top:1px solid var(--line);padding:12px 0}.issue strong{display:block}.issue small{color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:1fr}.logs{height:360px}}
</style></head>
<body>
<header><div><h1>Vivarqo Dev Manager</h1><div class="muted">Supervisione ambiente locale · aggiornamento live</div></div><div class="toolbar"><button id="notify" class="secondary">Abilita notifiche</button><button id="refresh" class="secondary">Aggiorna</button></div></header>
<main>
<section class="grid" id="services"><div class="panel muted">Caricamento servizi…</div></section>
<div class="layout">
<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2>Log in tempo reale</h2><span class="muted" id="connection">Connessione…</span></div><div class="toolbar" style="margin-bottom:12px"><button class="secondary" data-filter="all">Tutti</button><button class="secondary" data-filter="ERROR">Errori</button><button class="secondary" data-filter="WARN">Avvisi</button></div><div class="logs" id="logs"></div></section>
<aside class="panel"><h2>Diagnostica raggruppata</h2><div id="diagnostics" class="muted">Nessun problema rilevato.</div><h2 style="margin-top:24px">Ambiente</h2><div id="environment" class="muted">—</div></aside>
</div>
</main>
<script>
const $=s=>document.querySelector(s);let allLogs=[],filter='all',notificationEnabled=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderServices(items){$('#services').innerHTML=items.map(s=>'<div class="service"><div><div class="name">'+esc(s.label)+'</div><div class="muted">PID '+esc(s.pid||'—')+' · riavvii '+esc(s.restarts||0)+'</div><div class="muted">'+esc(s.detail||'')+'</div></div><span class="state '+esc(s.state)+'">'+esc(s.stateLabel)+'</span></div>').join('')}
function renderLogs(){const items=filter==='all'?allLogs:allLogs.filter(x=>x.level===filter);$('#logs').innerHTML=items.slice(-600).map(x=>'<div class="log '+esc(x.level)+'">'+esc(x.timestamp)+' ['+esc(x.level)+'] ['+esc(x.service)+'] '+esc(x.message)+'</div>').join('');$('#logs').scrollTop=$('#logs').scrollHeight}
function renderDiagnostics(items){$('#diagnostics').innerHTML=items.length?items.map(x=>'<div class="issue"><strong>'+esc(x.title)+' <small>×'+esc(x.count)+'</small></strong><div>'+esc(x.advice)+'</div><small>Servizi: '+esc(x.services.join(', '))+' · ultimo evento '+esc(x.lastSeen||'')+'</small></div>').join(''):'Nessun problema rilevato.'}
async function refresh(){const r=await fetch('/api/state');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();renderServices(d.services);renderDiagnostics(d.diagnostics);$('#environment').textContent=d.environment;allLogs=d.logs;renderLogs()}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;renderLogs()}));
$('#refresh').onclick=()=>refresh().catch(e=>$('#connection').textContent=e.message);
$('#notify').onclick=async()=>{if(!('Notification'in window)){alert('Notifiche browser non supportate.');return}const p=await Notification.requestPermission();notificationEnabled=p==='granted';$('#notify').textContent=notificationEnabled?'Notifiche abilitate':'Abilita notifiche'};
const stream=new EventSource('/events');stream.onopen=()=>$('#connection').textContent='Connesso';stream.onerror=()=>$('#connection').textContent='Riconnessione…';
stream.onmessage=e=>{const data=JSON.parse(e.data);if(data.type==='log'){allLogs.push(data.item);if(allLogs.length>1000)allLogs.shift();renderLogs();if(notificationEnabled&&['ERROR','FATAL'].includes(data.item.level))new Notification('Vivarqo · '+data.item.service,{body:data.item.message.slice(0,180)})}else if(data.type==='state'){renderServices(data.services);renderDiagnostics(data.diagnostics)}};
refresh().catch(e=>$('#connection').textContent='Errore: '+e.message);
</script></body></html>
